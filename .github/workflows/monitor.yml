name: season-monitor
# Turgor live monitor: runs the day after each weekly anchor (1, 8, 15, 22 of each month),
# December to April, and commits the outputs to monitor/. Can also be run by hand.
on:
  schedule:
    - cron: "17 9 2,9,16,23 12,1,2,3,4 *"
  workflow_dispatch:
    inputs:
      asof:
        description: "As-of date YYYY-MM-DD (empty = today)"
        required: false
permissions:
  contents: write
concurrency: monitor
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run monitor
        env:
          ASOF: ${{ github.event.inputs.asof }}
        run: |
          if [ -n "$ASOF" ]; then python scripts/17_monitor.py --asof "$ASOF"; else python scripts/17_monitor.py; fi
      - name: Commit outputs
        run: |
          git config user.name "turgor-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add monitor
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "Monitor: data up to $(tail -1 monitor/log.csv | cut -d, -f3)"
          git pull --rebase
          git push
